name: Release

run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.26.x
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install Gio Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev \
            libffi-dev libxcursor-dev libvulkan-dev

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build Linux amd64 binary
        env:
          CGO_ENABLED: "1"
          GOARCH: amd64
          GOOS: linux
        run: |
          mkdir -p dist/package
          go build -trimpath -ldflags="-s -w" -o dist/package/growse ./cmd/growse

      - name: Package release archive
        shell: bash
        run: |
          cp README.md dist/package/
          mkdir -p dist/package/examples/counter
          cp examples/counter/index.html dist/package/examples/counter/
          cp examples/counter/style.css dist/package/examples/counter/
          cp examples/counter/_app.go dist/package/examples/counter/
          archive_name="growse_${RELEASE_TAG}_linux_amd64.tar.gz"
          tar -czf "dist/$archive_name" -C dist/package .
          cd dist
          sha256sum "$archive_name" > "$archive_name.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="dist/growse_${RELEASE_TAG}_linux_amd64.tar.gz"
          checksum="${archive}.sha256"
          gh release create "$RELEASE_TAG" \
            "$archive#Growse Linux amd64" \
            "$checksum#SHA-256 checksum" \
            --verify-tag \
            --title "Growse $RELEASE_TAG" \
            --generate-notes
