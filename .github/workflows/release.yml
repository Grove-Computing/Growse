name: Release

run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.26.6
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  source-security:
    name: Revalidate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Scan source tree for hidden payloads
        run: go run ./cmd/securityscan

      - name: Install Gio Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev \
            libffi-dev libxcursor-dev libvulkan-dev

      - name: Revalidate Go dependencies
        env:
          GOVULNCHECK_VERSION: v1.6.0
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  build:
    name: Build ${{ matrix.name }}
    needs: source-security
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            cgo_enabled: "1"
            artifact: linux_amd64
            archive_extension: tar.gz
          - name: macOS Intel
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            cgo_enabled: "1"
            artifact: macos_amd64
            archive_extension: tar.gz
          - name: macOS Apple Silicon
            runner: macos-15
            goos: darwin
            goarch: arm64
            cgo_enabled: "1"
            artifact: macos_arm64
            archive_extension: tar.gz
          - name: Windows amd64
            runner: windows-2025
            goos: windows
            goarch: amd64
            cgo_enabled: "0"
            artifact: windows_amd64
            archive_extension: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install Gio Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev \
            libffi-dev libxcursor-dev libvulkan-dev

      - name: Download modules
        shell: bash
        run: go mod download

      - name: Run tests
        shell: bash
        run: go test ./...

      - name: Build executable
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
        run: |
          mkdir -p dist/package/examples
          scripts/package-gui.sh dist/package "$RELEASE_TAG" "$GITHUB_RUN_NUMBER"
          cp README.md SECURITY.md LICENSE.md dist/package/
          cp -R examples/counter examples/todo examples/css3-core examples/flexbox examples/dashboard examples/animation examples/data-app dist/package/examples/

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive_name="growse_${RELEASE_TAG}_${{ matrix.artifact }}.tar.gz"
          tar -czf "dist/$archive_name" -C dist/package .
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$archive_name" > "$archive_name.sha256")
          else
            (cd dist && shasum -a 256 "$archive_name" > "$archive_name.sha256")
          fi

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archiveName = "growse_${env:RELEASE_TAG}_${{ matrix.artifact }}.zip"
          Compress-Archive -Path "dist/package/*" -DestinationPath "dist/$archiveName"
          $hash = (Get-FileHash "dist/$archiveName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content "dist/$archiveName.sha256" -Encoding ascii

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/package
          format: spdx-json
          output-file: dist/growse_${{ env.RELEASE_TAG }}_${{ matrix.artifact }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SPDX SBOM
        shell: bash
        run: scripts/validate-sbom.sh "dist/growse_${RELEASE_TAG}_${{ matrix.artifact }}.spdx.json"

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/*.spdx.json
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest ${{ matrix.name }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            artifact: linux_amd64
            archive_extension: tar.gz
          - name: macOS Intel
            artifact: macos_amd64
            archive_extension: tar.gz
          - name: macOS Apple Silicon
            artifact: macos_arm64
            archive_extension: tar.gz
          - name: Windows amd64
            artifact: windows_amd64
            archive_extension: zip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-${{ matrix.artifact }}
          path: dist

      - name: Attest archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/growse_${{ env.RELEASE_TAG }}_${{ matrix.artifact }}.${{ matrix.archive_extension }}

      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/growse_${{ env.RELEASE_TAG }}_${{ matrix.artifact }}.spdx.json

      - name: Attest archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/growse_${{ env.RELEASE_TAG }}_${{ matrix.artifact }}.${{ matrix.archive_extension }}
          sbom-path: dist/growse_${{ env.RELEASE_TAG }}_${{ matrix.artifact }}.spdx.json

  release-gate:
    name: Release cool-down
    needs:
      - build
      - source-security
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
    steps:
      - name: Record release source identity
        shell: bash
        run: |
          echo "Release tag: $RELEASE_TAG"
          echo "Release commit: $GITHUB_SHA"
          echo "Repository: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

  docker:
    name: Build, scan, and publish Docker image
    needs:
      - build
      - release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$image_name" >> "$GITHUB_ENV"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image with attestations
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:build-${{ github.run_id }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
          sbom: true
          provenance: mode=max

      - name: Verify OCI SBOM and provenance by digest
        shell: bash
        run: |
          image_ref="$IMAGE_NAME@${{ steps.build.outputs.digest }}"
          echo "Container digest: ${{ steps.build.outputs.digest }}"
          test "$(docker buildx imagetools inspect "$image_ref" --format '{{ json .SBOM.SPDX }}')" != "null"
          test "$(docker buildx imagetools inspect "$image_ref" --format '{{ json .Provenance.SLSA }}')" != "null"

      - name: Scan published image by digest
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Promote verified image tags by digest
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$RELEASE_TAG" \
            --tag "$IMAGE_NAME:latest" \
            "$IMAGE_NAME@${{ steps.build.outputs.digest }}"

  container-attest:
    name: Attest Docker image
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Attest container provenance by digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.docker.outputs.image }}
          subject-digest: ${{ needs.docker.outputs.digest }}
          push-to-registry: true

      - name: Verify GitHub attestation by digest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh attestation verify "oci://${{ needs.docker.outputs.image }}@${{ needs.docker.outputs.digest }}" --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish GitHub Release
    needs:
      - build
      - attest
      - docker
      - container-attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Release commit: $GITHUB_SHA"
          cat dist/*.sha256
          gh release create "$RELEASE_TAG" dist/* install.sh \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Growse $RELEASE_TAG" \
            --generate-notes
