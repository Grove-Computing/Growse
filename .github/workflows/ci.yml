name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.6
  STATICCHECK_VERSION: "2026.1"
  GOVULNCHECK_VERSION: v1.6.0
  ACTIONLINT_VERSION: v1.7.12
  MIN_COVERAGE: "70.0"

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install Gio Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev \
            libffi-dev libxcursor-dev libvulkan-dev

      - name: Download modules
        run: go mod download

      - name: Bootstrap source security scan
        run: go run ./cmd/securityscan

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check module files
        run: go mod tidy -diff

      - name: Test v0.9.0 installer
        run: |
          bash tests/install.sh
          bash tests/install-platforms.sh

      - name: Validate release artifact matrix
        run: bash tests/release.sh

      - name: Validate Docker release
        run: bash tests/docker.sh

      - name: Validate supply chain security
        run: bash tests/supply-chain.sh

      - name: Validate developer supply chain security
        run: bash tests/developer-security.sh

      - name: Validate v0.9.0 documentation
        run: bash tests/docs.sh

      - name: Run race tests with coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce coverage threshold
        run: |
          go tool cover -func=coverage.out
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          echo "Total coverage: ${coverage}% (minimum: ${MIN_COVERAGE}%)"
          awk -v actual="$coverage" -v minimum="$MIN_COVERAGE" \
            'BEGIN { if (actual + 0 < minimum + 0) exit 1 }'

  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install Gio Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev \
            libffi-dev libxcursor-dev libvulkan-dev

      - name: Run go vet
        run: go vet ./...

      - name: Install Staticcheck
        run: go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"

      - name: Run Staticcheck
        run: staticcheck ./...

      - name: Install actionlint
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: Lint GitHub Actions workflows
        run: actionlint

  gui-package:
    name: GUI package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            cgo_enabled: "1"
          - name: macOS
            runner: macos-15
            goos: darwin
            goarch: arm64
            cgo_enabled: "1"
          - name: Windows
            runner: windows-2025
            goos: windows
            goarch: amd64
            cgo_enabled: "0"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install Gio Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev \
            libffi-dev libxcursor-dev libvulkan-dev

      - name: Download modules
        shell: bash
        run: go mod download

      - name: Run platform tests
        shell: bash
        run: go test ./...

      - name: Build GUI package
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
        run: scripts/package-gui.sh dist/package v0.9.0 "$GITHUB_RUN_NUMBER"

      - name: Verify GUI package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
        run: |
          case "$GOOS" in
            linux)
              test -x dist/package/growse
              test -f dist/package/share/applications/io.github.grovecomputing.Growse.desktop
              test -f dist/package/share/icons/hicolor/512x512/apps/io.github.grovecomputing.Growse.png
              ;;
            darwin)
              test -x dist/package/Growse.app/Contents/MacOS/growse
              test -f dist/package/Growse.app/Contents/Info.plist
              test -f dist/package/Growse.app/Contents/Resources/Growse.icns
              codesign --verify --deep --strict dist/package/Growse.app
              ;;
            windows)
              test -f dist/package/growse.exe
              test -f dist/package/share/windows/Growse.ico
              test -f dist/package/share/windows/install-shortcut.ps1
              ;;
          esac

  docker-package:
    name: Docker package (v0.9.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build v0.9.0 Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: growse:v0.9.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install Gio Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev \
            libffi-dev libxcursor-dev libvulkan-dev

      - name: Install govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Scan reachable vulnerabilities
        run: govulncheck ./...
