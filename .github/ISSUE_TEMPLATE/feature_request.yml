name: 新機能提案
description: Growseに追加したい機能や改善案を提案する
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景・解決したい課題
      description: 誰がどんな場面で困るか、または何を実現したいかを記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 期待する使い方や動作を具体的に記載してください。
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: 完了条件
      description: 実装できたかを判断できる条件を記載してください。
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・関連Issue
      description: 検討した方法や関連するIssueがあれば記載してください。
    validations:
      required: false
