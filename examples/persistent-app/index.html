<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Growse Persistent Notes</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="app" class="app">
    <header>
      <p class="eyebrow">Local-first workspace</p>
      <h1>Persistent Notes</h1>
      <p id="route" class="route">route: all</p>
    </header>
    <nav><button id="all-notes" type="button">All notes</button></nav>
    <form id="note-form">
      <label for="note-input">Current note</label>
      <input id="note-input" name="note" autocomplete="off" placeholder="Write a note">
    </form>
    <section id="note" class="note empty">No notes yet</section>
    <p id="status" class="status loading">loading</p>
  </main>
  <script type="text/go" src="/_app.go"></script>
</body>
</html>
