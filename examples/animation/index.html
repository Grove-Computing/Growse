<!doctype html>
<html>
<head>
  <title>Growse Animation Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="showcase">
    <p class="eyebrow">Growse v0.7.0</p>
    <h1>Motion, on our own timeline.</h1>
    <p class="lead">Hover the cards to reverse their transitions while the orbs keep moving.</p>
    <section class="stage">
      <span class="orb cyan"></span>
      <span class="orb violet"></span>
      <article class="card">
        <span class="status"></span>
        <h2>Frame-driven CSS</h2>
        <p>Transitions and keyframes share one monotonic timestamp.</p>
      </article>
    </section>
  </main>
</body>
</html>
