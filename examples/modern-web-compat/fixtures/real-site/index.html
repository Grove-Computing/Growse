<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Growse Real-site fixture</title>
  <link rel="stylesheet" href="/real-site/app.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <main id="real-site-root" data-ssr-token="real-site-v1" class="mx-auto max-w-5xl p-6 font-sans">
    <header class="flex items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold">🔎 脆弱性報告</h1>
        <p class="mt-1 text-sm text-slate-500">日本語・画像・animationを含むSvelteKit SSR相当fixture</p>
      </div>
      <span id="real-site-hydration" class="rounded-full bg-blue-100 px-3 py-1 text-sm text-blue-700">SSR</span>
    </header>
    <section class="my-6 rounded-card border border-amber-200 bg-white p-card shadow-sm">
      <div class="flex items-center justify-between">
        <strong class="text-lg">2026 Bug Bounty</strong>
        <span id="real-site-coin" class="animate-fixture-float text-2xl">💰</span>
      </div>
      <p class="mt-3 text-3xl font-bold text-amber-600">3万円</p>
    </section>
    <nav class="mb-4 flex gap-3 rounded-card bg-white p-card shadow-sm">
      <button id="real-site-all" type="button" class="rounded-lg bg-brand-500 px-4 py-2 font-bold text-white">すべて</button>
      <button id="real-site-high" type="button" class="rounded-lg px-4 py-2 font-bold text-slate-700">HIGHのみ</button>
      <output id="real-site-state" class="ml-auto text-sm text-slate-500">2件</output>
    </nav>
    <section id="real-site-grid" class="grid gap-4 md:grid-cols-2">
      <article id="real-site-medium" data-severity="medium" class="rounded-card border border-slate-200 bg-white p-card shadow-sm transition-opacity duration-300">
        <img src="/assets/pixel.png" alt="blue fixture" width="320" height="96" class="h-24 w-full rounded-lg object-cover">
        <h2 class="mt-3 font-mono font-bold">CVE-2026-71557</h2>
        <p class="mt-2">参照名によるパストラバーサル</p>
        <small class="mt-3 block text-amber-600">MEDIUM · CVSS 6.3</small>
      </article>
      <article id="real-site-high-card" data-severity="high" class="rounded-card border border-slate-200 bg-white p-card shadow-sm transition-transform duration-300">
        <img src="/assets/pixel.png" alt="blue fixture duplicate" width="320" height="96" class="h-24 w-full rounded-lg object-cover">
        <h2 class="mt-3 font-mono font-bold">CVE-2026-09086</h2>
        <p class="mt-2">URI検証バイパスによるXSS</p>
        <small class="mt-3 block text-red-600">HIGH · CVSS 7.3</small>
      </article>
    </section>
  </main>
  <script type="module" src="/real-site/app.mjs"></script>
</body>
</html>
