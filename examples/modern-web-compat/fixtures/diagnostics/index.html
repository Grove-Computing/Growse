<!doctype html>
<html lang="ja">
<head>

  <title>Modern compatibility failure diagnostics</title>

    @font-face { font-family: BrokenFixture; src: url("/diagnostics/bad.woff2") format("woff2"); }
    body { font-family: BrokenFixture, sans-serif; }
    .unsupported-target { unknown-modern-property: impossible(1); }
  </style>
</head>
<body>
  <main id="diagnostic-root" class="unsupported-target">
    <h1>Finite failure diagnostics</h1>

    <p id="chunk-state">chunk pending</p>
    <button id="hydration-error" type="button">Trigger hydration error</button>
    <button id="unsupported-global-error" type="button">Trigger unsupported global error</button>
    <button id="event-error" type="button">Trigger Event error</button>
    <button id="observer-error" type="button">Trigger observer error</button>
  </main>
  <script type="module" src="/diagnostics/failures.mjs"></script>

</html>
