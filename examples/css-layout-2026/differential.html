<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Layout 2026 differential fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-width: 0; background: #fff; }
    body { width: 720px; font-size: 0; }
    #snapshot { display: none; }
    #page {
      display: grid;
      width: 720px;
      height: 620px;
      padding: 20px;
      grid-template-columns: 180px 480px;
      grid-template-rows: 80px 260px 200px;
      gap: 20px;
      background: #f8fafc;
    }
    #header { grid-column: 1 / 3; background: #0f766e; }
    #sidebar { grid-column: 1; grid-row: 2; background: #1d4ed8; }
    #workspace {
      grid-column: 2;
      grid-row: 2;
      display: grid;
      grid-template-columns: 140px 140px 160px;
      grid-template-rows: 100px 140px;
      gap: 10px;
      padding: 10px;
      background: #e2e8f0;
    }
    #card-a { grid-column: 1; grid-row: 1 / 3; background: #f59e0b; }
    #card-b { grid-column: 2 / 4; grid-row: 1; background: #8b5cf6; }
    #card-c { grid-column: 2; grid-row: 2; background: #ec4899; }
    #card-d { grid-column: 3; grid-row: 2; background: #22c55e; }
    #footer {
      grid-column: 1 / 3;
      grid-row: 3;
      display: flex;
      align-items: flex-start;
      gap: 20px;
      padding: 20px;
      background: #cbd5e1;
    }
    #scroller { width: 300px; height: 140px; overflow: auto; background: #fff; }
    #scroll-content { width: 520px; height: 260px; background: #ef4444; }
    #flex-probe { display: flex; width: 320px; height: 140px; gap: 20px; background: #334155; }
    #flex-a { flex: 0 0 100px; height: 80px; background: #38bdf8; }
    #flex-b { flex: 1 1 auto; height: 120px; background: #a3e635; }
  </style>
</head>
<body>
  <main id="page">
    <header id="header"></header>
    <aside id="sidebar"></aside>
    <section id="workspace">
      <div id="card-a"></div><div id="card-b"></div><div id="card-c"></div><div id="card-d"></div>
    </section>
    <footer id="footer">
      <div id="scroller"><div id="scroll-content"></div></div>
      <div id="flex-probe"><div id="flex-a"></div><div id="flex-b"></div></div>
    </footer>
  </main>
  <pre id="snapshot"></pre>
  <script>
    (() => {
      const ids = ["page", "header", "sidebar", "workspace", "card-a", "card-b", "card-c", "card-d", "footer", "scroller", "scroll-content", "flex-probe", "flex-a", "flex-b"];
      const geometry = {};
      const computed = {};
      for (const id of ids) {
        const node = document.getElementById(id);
        const rect = node.getBoundingClientRect();
        const style = getComputedStyle(node);
        geometry[id] = {x: rect.x, y: rect.y, width: rect.width, height: rect.height};
        computed[id] = {display: style.display, position: style.position, overflowX: style.overflowX, overflowY: style.overflowY};
      }
      const result = {
        scenario: "css-layout-2026-desktop",
        viewport: {width: innerWidth, height: innerHeight},
        domLandmarks: ids,
        computed,
        geometry,
        scrollExtent: {width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight},
        focus: "",
        resources: {fixture: "complete"}
      };
      document.getElementById("snapshot").textContent = JSON.stringify(result);
      document.title = "SNAPSHOT_READY";
    })();
  </script>
</body>
</html>
